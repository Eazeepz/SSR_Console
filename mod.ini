[mod]
name = SR1_Console
author = you
version = 1.0
description = Developer console for Saints Row 1 (recompiled). ~ toggles the console on/off. While open, all typing keys are captured and forwarded to the game so you can enter commands. Single-player or private party only.

[settings]
; Game address of the console byte (0x hex).
; Cheat Engine address 0x183710223 minus the 0x100000000 memory base.
address = 0x83710223
; Key that toggles the console on/off. Use a loader key name ("F8") or ~ .
key = ~

; Flag values sent with each key event (Xbox keystroke flags: 1 = down, 2 = up, 4 = repeat).
flag_down = 1
flag_up = 2
flag_repeat = 4
; 1 = send repeat events while a key is held, 0 = don't.
repeat = 1
; How many key events to write to the log.
log_events = 40
